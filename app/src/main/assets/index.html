<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courier Tracker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#fff;font-family:system-ui}.app{padding-bottom:70px}header{padding:15px 18px;background:#111318}.ey{font-size:10px;letter-spacing:2px;color:#8b93a0}h1,h2{margin:2px 0}.map{height:48vh;min-height:300px}.card{margin:-38px 12px 0;position:relative;background:#15181e;border:1px solid #292e37;border-radius:18px;padding:16px}.big{font-size:31px;font-weight:800}.small{color:#8b93a0;font-size:10px;letter-spacing:1px}.row{display:flex;justify-content:space-between;color:#999;margin-top:8px}.buttons{display:flex;gap:8px;padding:12px}.buttons button{flex:1;border:0;border-radius:13px;padding:16px;font-weight:800}.p{background:#f2f4f7;color:#111}.s{background:#252a32;color:#fff}.d{background:#c83d46;color:#fff}.hidden{display:none}.page{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#15181e;border:1px solid #292e37;border-radius:14px;padding:13px}.box b{display:block;font-size:21px;margin-top:5px}.shift{background:#15181e;border:1px solid #292e37;border-radius:14px;padding:14px;margin:8px 0}nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#12151a;display:flex}nav button{flex:1;background:none;border:0;color:#aaa}dialog{background:#15181e;color:#fff;border:1px solid #333;border-radius:18px;width:88%}label{display:block;color:#aaa;font-size:12px;margin:10px 0}input{width:100%;padding:11px;background:#0d0f13;color:#fff;border:1px solid #333;border-radius:9px;margin-top:5px}</style></head><body><div class="app"><header><div class="ey">COURIER TRACKER</div><h1>Shift</h1></header><div id="home"><div id="map" class="map"></div><div class="card"><div class="big" id="timer">00:00:00</div><div class="small">TIME</div><div class="big" id="dist">0.00 km</div><div class="small">DISTANCE</div><div class="row"><span>GPS</span><b id="gps">OFF</b></div></div><div class="buttons"><button id="start" class="p">START</button><button id="pause" class="s hidden">PAUSE</button><button id="finish" class="d hidden">FINISH</button></div></div><div id="history" class="page hidden"><h2>History</h2><div id="list"></div></div><div id="stats" class="page hidden"><h2>Statistics</h2><div class="buttons"><button class="p" onclick="period=7;renderStats()">7 DAYS</button><button class="s" onclick="period=30;renderStats()">30 DAYS</button><button class="s" onclick="period='month';renderStats()">MONTH</button><button class="s" onclick="period=365;renderStats()">YEAR</button><button class="s" onclick="period='all';renderStats()">ALL</button></div><div class="grid"><div class="box">INCOME<b id="inc">0 zł</b></div><div class="box">DISTANCE<b id="km">0 km</b></div><div class="box">TIME<b id="time">0h</b></div><div class="box">ORDERS<b id="ord">0</b></div><div class="box">zł / HOUR<b id="hour">0</b></div><div class="box">zł / KM<b id="perkm">0</b></div></div></div><nav><button onclick="tab('home')">🚴<br>Shift</button><button onclick="tab('history')">📋<br>History</button><button onclick="tab('stats')">📊<br>Stats</button></nav></div><dialog id="dlg"><form method="dialog" id="form"><h2>Finish shift</h2><label>Date<input id="date" type="date"></label><label>Orders<input id="orders" type="number" value="0"></label><label>Income (PLN)<input id="income" type="number" step=".01" value="0"></label><label>Time (minutes)<input id="mins" type="number"></label><label>Distance (km)<input id="fdist" type="number" step=".01"></label><p><button value="cancel">Cancel</button> <button value="save">Save</button></p></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let shifts=JSON.parse(localStorage.getItem("shifts")||"[]"),period=7,run=false,paused=false,st={start:0,elapsed:0,distance:0},lastPoint=null;
const $=id=>document.getElementById(id);
let map=L.map("map").setView([51.76,19.46],13),line=L.polyline([],{weight:5}).addTo(map);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
function tm(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return [h,m,q].map(v=>String(v).padStart(2,"0")).join(":")}
function nativeState(){try{let x=JSON.parse(Android.state());if(x.start){st.start=x.start;st.elapsed=x.elapsed||0;st.distance=x.distance||0;run=true;paused=x.paused||false;$("pause").classList.remove("hidden");$("finish").classList.remove("hidden");$("start").classList.add("hidden");}}catch(e){}}
setInterval(()=>{let e=run?(paused?st.elapsed:Date.now()-st.start):st.elapsed;$("timer").textContent=tm(e);$("dist").textContent=st.distance.toFixed(2)+" km";},500);
$("start").onclick=()=>{run=true;paused=false;st={start:Date.now(),elapsed:0,distance:0};Android.start();$("start").classList.add("hidden");$("pause").classList.remove("hidden");$("finish").classList.remove("hidden");$("gps").textContent="ON"};
$("pause").onclick=()=>{if(!paused){st.elapsed=Date.now()-st.start;paused=true;Android.pause();$("pause").textContent="RESUME"}else{st.start=Date.now()-st.elapsed;paused=false;Android.resume();$("pause").textContent="PAUSE"}};
$("finish").onclick=()=>{$("date").value=new Date().toISOString().slice(0,10);$("mins").value=Math.round((paused?st.elapsed:Date.now()-st.start)/60000);$("fdist").value=st.distance.toFixed(2);$("dlg").showModal()};
$("form").onsubmit=e=>{e.preventDefault();if(e.submitter.value==="cancel"){$("dlg").close();return}shifts.unshift({date:$("date").value,orders:+$("orders").value,income:+$("income").value,minutes:+$("mins").value,distance:+$("fdist").value});localStorage.setItem("shifts",JSON.stringify(shifts));Android.stop();run=false;paused=false;$("start").classList.remove("hidden");$("pause").classList.add("hidden");$("finish").classList.add("hidden");$("pause").textContent="PAUSE";$("gps").textContent="OFF";$("dlg").close();renderHistory();renderStats()};
function tab(x){["home","history","stats"].forEach(y=>$(y).classList.toggle("hidden",x!==y));if(x==="history")renderHistory();if(x==="stats")renderStats();if(x==="home")setTimeout(()=>map.invalidateSize(),100)}
function renderHistory(){$("list").innerHTML=shifts.map(s=>"<div class='shift'><b>"+new Date(s.date+"T12:00:00").toLocaleDateString()+"</b> — <b>"+s.income.toFixed(2)+" zł</b><br>"+Math.floor(s.minutes/60)+"h "+s.minutes%60+"m · "+s.distance.toFixed(2)+" km · "+s.orders+" orders</div>").join("")||"<p>No shifts yet.</p>"}
function renderStats(){let now=new Date(),a=shifts.filter(s=>period==="all"||(period==="month"&&new Date(s.date).getMonth()===now.getMonth()&&new Date(s.date).getFullYear()===now.getFullYear())||(period!=="all"&&period!=="month"&&(now-new Date(s.date+"T23:59:59"))<=period*86400000));let inc=a.reduce((x,s)=>x+s.income,0),km=a.reduce((x,s)=>x+s.distance,0),mi=a.reduce((x,s)=>x+s.minutes,0),o=a.reduce((x,s)=>x+s.orders,0);$("inc").textContent=inc.toFixed(2)+" zł";$("km").textContent=km.toFixed(2)+" km";$("time").textContent=Math.floor(mi/60)+"h "+mi%60+"m";$("ord").textContent=o;$("hour").textContent=(mi?inc/(mi/60):0).toFixed(2);$("perkm").textContent=(km?inc/km:0).toFixed(2)}
renderHistory();renderStats();nativeState();
</script></body></html>
